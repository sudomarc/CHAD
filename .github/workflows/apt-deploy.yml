name: CHAD APT Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version de CHAD à déployer (ex: 0.1.0, 0.1.1)'
        required: false
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-apt-repo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CHAD in editable mode
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Set deployed version
        run: |
          VERSION="${{ github.event.inputs.version || '0.1.0' }}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Build CHAD .deb package (with specified version)
        run: |
          VERSION="${{ env.VERSION }}"
          echo "Construction de CHAD version $VERSION"
          # Mise à jour de la version dans le paquet
          sed -i "s/Version: ${CHAD_VERSION}/Version: ${VERSION}/" /opt/chad-apt/DEBIAN/control 2>/dev/null || true
          apt-get update -qq && apt-get install -y -qq dpkg-dev gnupg
          python3 -m venv /tmp/chad-venv
          /tmp/chad-venv/bin/pip install --quiet -e .
          which chad || echo "chad not in PATH"

      - name: Update APT repository metadata
        run: |
          VERSION="${{ env.VERSION }}"
          echo "Mise à jour du dépôt APT pour la version $VERSION"
          (cd /opt/chad-apt && dpkg-scanpackages -a amd64 "pool/main/c/chad" > "dists/stable/main/binary-amd64/Packages" 2>/dev/null || true)
          gzip -9c "/opt/chad-apt/dists/stable/main/binary-amd64/Packages" > "/opt/chad-apt/dists/stable/main/binary-amd64/Packages.gz"
          gpg --batch --homedir /tmp/chad-gnupg --default-key "$(gpg --batch --homedir /tmp/chad-gnupg --with-colons --list-keys CHAD APT Archive 2>/dev/null | awk -F: '/^fpr:/ {print $10; exit}')" --detach-sign --armor --output "dists/stable/Release.gpg" "dists/stable/Release" 2>/dev/null || true
          gpg --batch --homedir /tmp/chad-gnupg --default-key "$(gpg --batch --homedir /tmp/chad-gnupg --with-colons --list-keys CHAD APT Archive 2>/dev/null | awk -F: '/^fpr:/ {print $10; exit}')" --clearsign --output "dists/stable/InRelease" "dists/stable/Release" 2>/dev/null || true

      - name: Display CHAD info
        run: |
          echo "CHAD version: $(chad --version)"
          echo "Installed at: $(which chad)"
          echo "Deployed version from workflow: $VERSION"

  build-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          keep_files: .
          user_name: "sudomarc"
          user_email: "sudomarc@users.noreply.github.com"