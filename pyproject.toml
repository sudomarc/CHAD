[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chad-app"
version = "0.1.0"
description = "The official conversational application for LapisLLM"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28,<1.0",
]

[project.scripts]
chad = "chad.cli:app"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["chad*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
