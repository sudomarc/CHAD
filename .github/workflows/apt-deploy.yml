name: CHAD APT Deploy

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version de CHAD à déployer (ex: 0.1.0, 0.1.1)'
        required: false
        default: ''

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CHAD in editable mode
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Create deployment venv
        run: |
          python3 -m venv /opt/chad-venv
          /opt/chad-venv/bin/pip install --quiet -e .

      - name: Build .deb package (documented steps)
        run: |
          echo "Build .deb manuellement :"
          echo "  mkdir -p /tmp/chad-deb/DEBIAN /tmp/chad-deb/usr/bin"
          echo "  Remplir /tmp/chad-deb/DEBIAN/control avec la version"
          echo "  dpkg-deb --build /tmp/chad-deb"
          echo "  Copier le .deb dans /opt/chad-apt/pool/main/c/chad/"
          echo "  Générer Packages et Release avec dpkg-scanpackages"

      - name: Generate APT metadata
        run: |
          echo "Génération manuelle des métadonnées APT"
          echo "Utiliser dpkg-scanpackages, gzip, et les fichiers Release/InRelease"
          echo "Placer le dépôt sur la branche gh-pages de GitHub Pages"

      - name: Configure git for Pages deployment
        run: |
          git config user.name "sudomarc"
          git config user.email "sudomarc@users.noreply.github.com"
          git remote set-url origin https://github.com/sudomarc/CHAD.git

      - name: Deploy to GitHub Pages (site + repo APT)
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          target_branch: gh-pages
          keep_files: .
          user_name: "sudomarc"
          user_email: "sudomarc@users.noreply.github.com"

      - name: Display CHAD info
        run: |
          echo "CHAD version: $(chad --version)"
          echo "Installed at: $(which chad)"