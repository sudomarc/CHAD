[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "chad"
version = "0.1.0"
description = "Local-first general-purpose coding agent: Python-first runtime, terminal UI, provider-neutral model gateway."
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "CHAD maintainers"}]
license = {text = "MIT"}
dependencies = []

[project.scripts]
chad = "chad.cli:main"

[project.optional-dependencies]
dev = [
    "ruff>=0.9",
    "mypy>=1.11",
]
tui = [
    "textual>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]
