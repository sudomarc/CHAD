name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Debian packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes dpkg-dev gnupg

      - name: Install CHAD and development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run unit tests
        run: python -m unittest discover -s tests

      - name: Lint with Ruff
        run: ruff check src tests

      - name: Type check with Mypy
        run: mypy src tests
